[package]
name = "sumeru"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xumi-lab/Sumeru"
homepage = "https://github.com/xumi-lab/Sumeru"
description = "Sumeru — High-Performance Contiguous Columnar In-Memory State Engine & Flecs-Style Relational ECS in Rust (with Zero-Copy Apache Arrow & rkyv)"
keywords = ["ecs", "columnar", "arrow", "in-memory-database", "flecs"]
categories = ["data-structures", "database-implementations", "game-development", "simulation"]

[features]
default = []
gpu = ["dep:sumeru-macros", "dep:naga"]
gpu-metal = ["gpu"]
gpu-wgpu = ["gpu"]
test-internals = []

[dependencies]
ahash = "0.8.12"
arrow = { version = "56", default-features = false, features = ["ffi"] }
bincode = "1.3"
bytemuck = { version = "1.25", features = ["derive"] }
bytes = "1.11"
crc32c = "0.6"
naga = { version = "30", default-features = false, features = ["wgsl-in", "msl-out", "wgsl-out"], optional = true }
rayon = "1.12"
rkyv = { version = "0.8.17", features = ["bytecheck", "std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0.80"
smallvec = "1.15"
sumeru-macros = { version = "0.1.0", path = "crates/sumeru-macros", optional = true }
thiserror = "2"
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }

[[example]]
name = "quick_start"
path = "examples/quick_start.rs"

[[example]]
name = "flecs"
path = "examples/flecs/main.rs"

[[example]]
name = "gpu"
path = "examples/gpu/main.rs"
required-features = ["gpu"]

[[example]]
name = "gpu_multi_kernel_pass"
path = "examples/gpu_multi_kernel_pass.rs"
required-features = ["gpu"]
